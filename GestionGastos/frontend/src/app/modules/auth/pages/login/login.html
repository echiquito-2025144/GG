<div class="login-container">
  <div class="login-box">
    <h2>Iniciar Sesión</h2>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email"
          [(ngModel)]="email" 
          name="email" 
          placeholder="tu@correo.com"
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••"
          required>
      </div>

      <div *ngIf="errorMensaje" class="alert-error">
        {{ errorMensaje }}
      </div>

      <button type="submit" class="btn-primary">Ingresar</button>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #666;">
        ¿No tienes una cuenta? <a routerLink="/register" style="color: #0066cc; font-weight: bold; text-decoration: none;">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
